apiVersion: apps/v1
kind: Deployment
metadata:
  name: remix-weather-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remix-weather-app
  template:
    metadata:
      labels:
        app: remix-weather-app
    spec:
      containers:
      - name: remix-weather-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 3000