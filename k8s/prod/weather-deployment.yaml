apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-prod
  labels:
    app: weather-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-prod
  template:
    metadata:
      labels:
        app: weather-prod
    spec:
      containers:
        - name: weather
          image: cst8918acr.azurecr.io/weather:prod
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: REDIS_URL
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: WEATHER_API_KEY