apiVersion: apps/v1
kind: Deployment
metadata:
  name: remix-weather-app
  namespace: test
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: remix-weather-app
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
