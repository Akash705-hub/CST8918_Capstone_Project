# Test Environment Kustomization
# This file describes how to customize the base deployment for the test environment

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test

# Resources to include
resources:
  - ../base

# Name prefix for all resources in test
namePrefix: test-

# Patches for test environment
patchesStrategicMerge:
  - deployment.yaml

# ConfigMap for test environment
configMapGenerator:
  - name: app-config
    env: .env.test
    behavior: merge

# Images for test
images:
  - name: cst8918acr.azurecr.io/remix-weather-app
    newTag: test-latest
