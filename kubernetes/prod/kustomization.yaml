# Production Environment Kustomization
# This file describes how to customize the base deployment for the production environment

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

# Resources to include
resources:
  - ../base

# Name prefix for all resources in prod
namePrefix: prod-

# Patches for prod environment
patchesStrategicMerge:
  - deployment.yaml

# ConfigMap for prod environment
configMapGenerator:
  - name: app-config
    env: .env.prod
    behavior: merge

# Images for prod
images:
  - name: cst8918acr.azurecr.io/remix-weather-app
    newTag: latest

# Replicas for prod (higher availability)
replicas:
  - name: remix-weather-app
    count: 3
