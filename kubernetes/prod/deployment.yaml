apiVersion: apps/v1
kind: Deployment
metadata:
  name: remix-weather-app
  namespace: prod
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: remix-weather-app
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - remix-weather-app
              topologyKey: kubernetes.io/hostname
